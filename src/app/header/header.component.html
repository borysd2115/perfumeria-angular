<header class="bg-light shadow-sm">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light">
        
        <a class="navbar-brand" href="#">
          <img src="../assets/logo.png" alt="Logo" height="80">
        </a>

        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
          <span class="navbar-toggler-icon"></span>
        </button>

        
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" routerLink="/" routerLinkActive="active">Strona główna</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="../perfumy-meskie" routerLinkActive="active">Perfumy męskie</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/perfumy-damskie" routerLinkActive="active">Perfumy damskie</a>
            </li>
          </ul>

          <a routerLink="/koszyk" class="btn btn-outline-dark position-relative ms-auto">
            <i class="bi bi-cart"></i>
            <span *ngIf="cartItemCount > 0" 
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ cartItemCount }}
            </span>
          </a>
        </div>
      </nav>
    </div>
  </header>
